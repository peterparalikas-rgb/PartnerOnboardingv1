$kind: http-request
url: "{{baseUrl}}/products/:productId/reviews"
method: POST
headers:
  Content-Type: application/json
  Accept: application/json
pathVariables:
  productId: prod_123
body:
  type: json
  content: |-
    {
      "author": "Jane Doe",
      "rating": 5,
      "title": "Excellent product",
      "body": "Works exactly as described and shipped fast."
    }
settings: {}
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status code is 200 or 201', function () {
        pm.expect(pm.response.code).to.be.oneOf([200, 201]);
      });

      pm.test('Response time is below 2000ms', function () {
        pm.expect(pm.response.responseTime).to.be.below(2000);
      });

      pm.test('Content-Type is application/json', function () {
        pm.expect(pm.response.headers.get('Content-Type')).to.include('application/json');
      });

      pm.test('Response body is valid JSON', function () {
        pm.response.json();
      });

      pm.test('Created review is returned with an id', function () {
        var body = pm.response.json();
        var review = body.data || body;
        pm.expect(review).to.be.an('object');
        pm.expect(review).to.have.property('id');
      });
examples: ./.resources/Create Review.resources/examples
order: 1000
