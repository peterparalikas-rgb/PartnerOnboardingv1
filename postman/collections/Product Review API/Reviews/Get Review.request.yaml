$kind: http-request
url: "{{baseUrl}}/reviews/:reviewId"
method: GET
headers:
  Accept: application/json
pathVariables:
  reviewId: rev_456
settings: {}
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status code is 200', function () {
        pm.response.to.have.status(200);
      });

      pm.test('Response time is below 2000ms', function () {
        pm.expect(pm.response.responseTime).to.be.below(2000);
      });

      pm.test('Content-Type is application/json', function () {
        pm.expect(pm.response.headers.get('Content-Type')).to.include('application/json');
      });

      pm.test('Response body is valid JSON', function () {
        pm.response.json();
      });

      pm.test('Response contains a review id', function () {
        var body = pm.response.json();
        var review = body.data || body;
        pm.expect(review).to.be.an('object');
        pm.expect(review).to.have.property('id');
      });
examples: ./.resources/Get Review.resources/examples
order: 2000
