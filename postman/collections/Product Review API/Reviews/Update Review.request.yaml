$kind: http-request
url: "{{baseUrl}}/reviews/:reviewId"
method: PUT
headers:
  Content-Type: application/json
  Accept: application/json
pathVariables:
  reviewId: rev_456
body:
  type: json
  content: |-
    {
      "rating": 4,
      "title": "Still good after a month",
      "body": "Updated: minor wear but overall great."
    }
settings: {}
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status code is 200', function () {
        pm.response.to.have.status(200);
      });

      pm.test('Response time is below 2000ms', function () {
        pm.expect(pm.response.responseTime).to.be.below(2000);
      });

      pm.test('Content-Type is application/json', function () {
        pm.expect(pm.response.headers.get('Content-Type')).to.include('application/json');
      });

      pm.test('Response body is valid JSON', function () {
        pm.response.json();
      });

      pm.test('Updated review reflects new rating', function () {
        var body = pm.response.json();
        var review = body.data || body;
        pm.expect(review).to.be.an('object');
        pm.expect(review).to.have.property('rating');
      });
examples: ./.resources/Update Review.resources/examples
order: 3000
