$kind: http-example
request:
  url: "{{baseUrl}}/products/:productId/reviews"
  method: POST
  headers:
    Content-Type: application/json
    Accept: application/json
  pathVariables:
    productId: prod_123
  body:
    type: json
    content: |-
      {
        "author": "Jane Doe",
        "rating": 5,
        "title": "Excellent product",
        "body": "Works exactly as described and shipped fast."
      }
response:
  statusCode: 201
  statusText: Created
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "id": "rev_456",
        "productId": "prod_123",
        "author": "Jane Doe",
        "rating": 5,
        "title": "Excellent product",
        "body": "Works exactly as described and shipped fast.",
        "createdAt": "2024-05-01T10:15:00Z",
        "updatedAt": "2024-05-01T10:15:00Z"
      }
order: 1000
