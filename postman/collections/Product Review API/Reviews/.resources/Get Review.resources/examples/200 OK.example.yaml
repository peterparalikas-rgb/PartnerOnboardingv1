$kind: http-example
request:
  url: "{{baseUrl}}/reviews/:reviewId"
  method: GET
  headers:
    Accept: application/json
  pathVariables:
    reviewId: rev_456
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "id": "rev_456",
        "productId": "prod_123",
        "author": "Jane Doe",
        "rating": 5,
        "title": "Excellent product",
        "body": "Works exactly as described and shipped fast.",
        "createdAt": "2024-05-01T10:15:00Z",
        "updatedAt": "2024-05-01T10:15:00Z"
      }
order: 1000
