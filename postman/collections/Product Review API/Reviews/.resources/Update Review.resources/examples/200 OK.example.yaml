$kind: http-example
request:
  url: "{{baseUrl}}/reviews/:reviewId"
  method: PUT
  headers:
    Content-Type: application/json
    Accept: application/json
  pathVariables:
    reviewId: rev_456
  body:
    type: json
    content: |-
      {
        "rating": 4,
        "title": "Still good after a month",
        "body": "Updated: minor wear but overall great."
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "id": "rev_456",
        "productId": "prod_123",
        "author": "Jane Doe",
        "rating": 4,
        "title": "Still good after a month",
        "body": "Updated: minor wear but overall great.",
        "createdAt": "2024-05-01T10:15:00Z",
        "updatedAt": "2024-06-02T09:05:00Z"
      }
order: 1000
