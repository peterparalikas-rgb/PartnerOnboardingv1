$kind: http-request
url: "{{baseUrl}}/products/:productId"
method: GET
headers:
  Accept: application/json
pathVariables:
  productId: prod_123
settings: {}
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status code is 200', function () {
        pm.response.to.have.status(200);
      });

      pm.test('Response time is below 2000ms', function () {
        pm.expect(pm.response.responseTime).to.be.below(2000);
      });

      pm.test('Content-Type is application/json', function () {
        pm.expect(pm.response.headers.get('Content-Type')).to.include('application/json');
      });

      pm.test('Response body is valid JSON', function () {
        pm.response.json();
      });

      pm.test('Response contains a product id', function () {
        var body = pm.response.json();
        var product = body.data || body;
        pm.expect(product).to.be.an('object');
        pm.expect(product).to.have.property('id');
      });
examples: ./.resources/Get Product.resources/examples
order: 2000
