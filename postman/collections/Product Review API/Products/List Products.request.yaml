$kind: http-request
url: "{{baseUrl}}/products?page=1&limit=20"
method: GET
headers:
  Accept: application/json
queryParams:
  page: "1"
  limit: "20"
settings: {}
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status code is 200', function () {
        pm.response.to.have.status(200);
      });

      pm.test('Response time is below 2000ms', function () {
        pm.expect(pm.response.responseTime).to.be.below(2000);
      });

      pm.test('Content-Type is application/json', function () {
        pm.expect(pm.response.headers.get('Content-Type')).to.include('application/json');
      });

      pm.test('Response body is valid JSON', function () {
        pm.response.json();
      });

      pm.test('Response contains a list of products', function () {
        var body = pm.response.json();
        var items = Array.isArray(body) ? body : (body.data || body.products || body.items);
        pm.expect(items, 'expected an array of products').to.be.an('array');
      });
examples: ./.resources/List Products.resources/examples
order: 1000
